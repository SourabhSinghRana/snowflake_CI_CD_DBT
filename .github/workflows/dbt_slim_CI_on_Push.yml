name: dbt Slim CI on Push

on:
  push:
    branches:
      - prod

jobs:
  run-changed-models:
    runs-on: ubuntu-latest
    env:
      # Define your target here so it applies to all steps
      DBT_TARGET: prod 
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      # 1. Baseline State (Prod)
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install dbt-core dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: Generate baseline state
        run: |
          cd dbt_project
          dbt deps
          dbt compile --target ${{ env.DBT_TARGET }}
          mkdir -p ../dbt-state
          cp target/manifest.json ../dbt-state/

      # 2. Test the New Code (PR Branch)
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Download dbt state from Production
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Replace this with the actual filename of your production deployment workflow
          workflow: dbt_slim_CI_on_Push.yml 
          branch: prod
          name: prod-dbt-state
          path: ./dbt-state # This creates a new folder named dbt-state and puts the manifest inside
          search_artifacts: true

      - name: Validate dbt connection
        run: |
          cd dbt_project
          dbt debug --profiles-dir . --target ${{ env.DBT_TARGET }}

      - name: Parse dbt project
        run: |
          cd dbt_project
          dbt deps
          dbt parse --profiles-dir . --target ${{ env.DBT_TARGET }}

      - name: Run lint check
        run: |
          cd dbt_project
          sqlfluff lint models --dialect snowflake

      # 3. Execute Modified Models
      - name: Run dbt models (Slim CI)
        run: |
          cd dbt_project
          dbt run --select state:modified+ --state ../dbt-state --profiles-dir . --target ${{ env.DBT_TARGET }}

      - name: Upload dbt state artifact
        uses: actions/upload-artifact@v4
        if: success() # Only save the state if the build didn't fail
        with:
          name: prod-dbt-state
          # dbt always saves the manifest in the target/ folder after a run
          path: ./dbt_project/target/manifest.json

      - name: Setup Snowflake CLI
        if: always()
        uses: snowflakedb/snowflake-cli-action@v2

      - name: Log GitHub Action Orchestration
        if: always()
        run: |
          snow sql -x -q "INSERT INTO MEDICAL.AUDIT.DEPLOYMENT_HISTORY_GITHUB_ACTION (GH_RUN_ID, BRANCH_NAME, WORKFLOW_NAME, COMMIT_SHA, DEPLOYMENT_STATUS, TRIGGERED_BY, TRIGGER_EVENT) VALUES ('${{ github.run_id }}', '${{ github.ref_name }}', '${{ github.workflow }}', '${{ github.sha }}', '${{ job.status }}', '${{ github.actor }}', 'SLIM_CI_PUSH');"
